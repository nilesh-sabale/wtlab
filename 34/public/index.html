<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Manager</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }
    h1 {
      color: #333;
      margin-bottom: 25px;
      text-align: center;
    }
    .form-section {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 30px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      color: #555;
      font-weight: 600;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      border: 2px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #667eea;
    }
    textarea {
      resize: vertical;
      min-height: 100px;
    }
    .btn {
      padding: 12px 25px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      margin-right: 10px;
    }
    .btn-primary {
      background: #667eea;
      color: white;
    }
    .btn-primary:hover {
      background: #5568d3;
    }
    .btn-cancel {
      background: #6c757d;
      color: white;
    }
    .btn-cancel:hover {
      background: #5a6268;
    }
    .btn-edit {
      background: #28a745;
      color: white;
      padding: 8px 15px;
      font-size: 13px;
    }
    .btn-delete {
      background: #dc3545;
      color: white;
      padding: 8px 15px;
      font-size: 13px;
    }
    h2 {
      color: #333;
      margin-bottom: 20px;
    }
    .blog-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .blog-card {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 8px;
      border-left: 4px solid #667eea;
    }
    .blog-card h3 {
      color: #333;
      margin-bottom: 10px;
    }
    .blog-meta {
      color: #666;
      font-size: 13px;
      margin-bottom: 10px;
    }
    .blog-content {
      color: #555;
      margin-bottom: 15px;
      line-height: 1.6;
    }
    .blog-actions {
      display: flex;
      gap: 10px;
    }
    .no-blogs {
      text-align: center;
      color: #999;
      padding: 40px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📝 Blog Manager</h1>
    
    <div class="form-section">
      <h2 id="formTitle">Create New Blog Post</h2>
      <form id="blogForm">
        <div class="form-group">
          <label>Title</label>
          <input type="text" id="title" required>
        </div>
        <div class="form-group">
          <label>Content</label>
          <textarea id="content" required></textarea>
        </div>
        <div class="form-group">
          <label>Author</label>
          <input type="text" id="author" required>
        </div>
        <button type="submit" class="btn btn-primary" id="submitBtn">Create Blog Post</button>
        <button type="button" class="btn btn-cancel" id="cancelBtn" style="display:none;">Cancel</button>
      </form>
    </div>

    <h2>All Blog Posts (<span id="blogCount">0</span>)</h2>
    <div id="blogList" class="blog-list"></div>
  </div>

  <script>
    const API = 'http://localhost:3000/api/blogs';
    let editId = null;

    const form = document.getElementById('blogForm');
    const submitBtn = document.getElementById('submitBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const formTitle = document.getElementById('formTitle');
    const blogList = document.getElementById('blogList');
    const blogCount = document.getElementById('blogCount');

    // Load blogs on page load
    loadBlogs();

    // Form submit
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const blog = {
        title: document.getElementById('title').value,
        content: document.getElementById('content').value,
        author: document.getElementById('author').value
      };

      try {
        if (editId) {
          await fetch(`${API}/${editId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(blog)
          });
          editId = null;
          submitBtn.textContent = 'Create Blog Post';
          formTitle.textContent = 'Create New Blog Post';
          cancelBtn.style.display = 'none';
        } else {
          await fetch(API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(blog)
          });
        }
        form.reset();
        loadBlogs();
      } catch (error) {
        alert('Error: ' + error.message);
      }
    });

    // Cancel button
    cancelBtn.addEventListener('click', () => {
      form.reset();
      editId = null;
      submitBtn.textContent = 'Create Blog Post';
      formTitle.textContent = 'Create New Blog Post';
      cancelBtn.style.display = 'none';
    });

    // Load all blogs
    async function loadBlogs() {
      try {
        const res = await fetch(API);
        const result = await res.json();
        const blogs = result.data;
        
        blogCount.textContent = blogs.length;
        
        if (blogs.length === 0) {
          blogList.innerHTML = '<p class="no-blogs">No blog posts yet. Create your first one!</p>';
          return;
        }
        
        blogList.innerHTML = blogs.map(blog => `
          <div class="blog-card">
            <h3>${blog.title}</h3>
            <p class="blog-meta">By ${blog.author} • ${new Date(blog.createdAt).toLocaleDateString()}</p>
            <p class="blog-content">${blog.content}</p>
            <div class="blog-actions">
              <button class="btn btn-edit" onclick="editBlog(${blog.id})">✏️ Edit</button>
              <button class="btn btn-delete" onclick="deleteBlog(${blog.id})">🗑️ Delete</button>
            </div>
          </div>
        `).join('');
      } catch (error) {
        console.error('Error loading blogs:', error);
        blogList.innerHTML = '<p class="no-blogs">Error loading blogs. Make sure server is running.</p>';
      }
    }

    // Edit blog
    window.editBlog = async function(id) {
      try {
        const res = await fetch(`${API}/${id}`);
        const result = await res.json();
        const blog = result.data;
        
        editId = id;
        document.getElementById('title').value = blog.title;
        document.getElementById('content').value = blog.content;
        document.getElementById('author').value = blog.author;
        
        submitBtn.textContent = 'Update Blog Post';
        formTitle.textContent = 'Edit Blog Post';
        cancelBtn.style.display = 'inline-block';
        
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } catch (error) {
        alert('Error loading blog: ' + error.message);
      }
    }

    // Delete blog
    window.deleteBlog = async function(id) {
      if (confirm('Delete this blog post?')) {
        try {
          await fetch(`${API}/${id}`, { method: 'DELETE' });
          loadBlogs();
        } catch (error) {
          alert('Error deleting blog: ' + error.message);
        }
      }
    }
  </script>
</body>
</html>
