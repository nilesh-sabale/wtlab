<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }
    h1 {
      color: #333;
      margin-bottom: 25px;
      text-align: center;
    }
    .form-section {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 30px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      color: #555;
      font-weight: 600;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      border: 2px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #667eea;
    }
    textarea {
      resize: vertical;
      min-height: 80px;
    }
    .btn {
      padding: 12px 25px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
    }
    .btn-primary {
      background: #667eea;
      color: white;
    }
    .btn-primary:hover {
      background: #5568d3;
    }
    .filter-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .tab {
      padding: 10px 20px;
      border: 2px solid #667eea;
      background: white;
      color: #667eea;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .tab.active {
      background: #667eea;
      color: white;
    }
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .task-card {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 8px;
      border-left: 4px solid #667eea;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .task-card.completed {
      border-left-color: #28a745;
      opacity: 0.8;
    }
    .task-info {
      flex: 1;
    }
    .task-title {
      color: #333;
      font-weight: 600;
      margin-bottom: 5px;
    }
    .task-card.completed .task-title {
      text-decoration: line-through;
      color: #666;
    }
    .task-desc {
      color: #666;
      font-size: 13px;
      margin-bottom: 5px;
    }
    .task-status {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
    }
    .task-status.pending {
      background: #fff3cd;
      color: #856404;
    }
    .task-status.completed {
      background: #d4edda;
      color: #155724;
    }
    .task-actions {
      display: flex;
      gap: 8px;
    }
    .btn-small {
      padding: 8px 15px;
      font-size: 13px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-complete {
      background: #28a745;
      color: white;
    }
    .btn-complete:hover {
      background: #218838;
    }
    .btn-delete {
      background: #dc3545;
      color: white;
    }
    .btn-delete:hover {
      background: #c82333;
    }
    .no-tasks {
      text-align: center;
      color: #999;
      padding: 40px;
    }
    h2 {
      color: #333;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>✅ Task Manager</h1>
    
    <div class="form-section">
      <h2>Add New Task</h2>
      <form id="taskForm">
        <div class="form-group">
          <label>Task Title</label>
          <input type="text" id="title" placeholder="Enter task title" required>
        </div>
        <div class="form-group">
          <label>Description (optional)</label>
          <textarea id="description" placeholder="Enter task description"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Add Task</button>
      </form>
    </div>

    <div class="filter-tabs">
      <button class="tab active" onclick="filterTasks('all')">All (<span id="countAll">0</span>)</button>
      <button class="tab" onclick="filterTasks('pending')">Pending (<span id="countPending">0</span>)</button>
    </div>

    <div id="taskList" class="task-list"></div>
  </div>

  <script>
    const API = 'http://localhost:3000/api/tasks';
    let currentFilter = 'all';

    const form = document.getElementById('taskForm');
    const taskList = document.getElementById('taskList');

    // Load tasks on page load
    loadTasks();

    // Form submit
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const task = {
        title: document.getElementById('title').value,
        description: document.getElementById('description').value
      };

      try {
        await fetch(API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(task)
        });
        form.reset();
        loadTasks();
      } catch (error) {
        alert('Error: ' + error.message);
      }
    });

    // Load all tasks
    async function loadTasks() {
      try {
        const res = await fetch(API);
        const result = await res.json();
        const tasks = result.data;
        
        // Update counts
        document.getElementById('countAll').textContent = tasks.length;
        document.getElementById('countPending').textContent = tasks.filter(t => t.status === 'pending').length;
        
        // Filter tasks
        let filteredTasks = tasks;
        if (currentFilter !== 'all') {
          filteredTasks = tasks.filter(t => t.status === currentFilter);
        }
        
        if (filteredTasks.length === 0) {
          taskList.innerHTML = '<p class="no-tasks">No tasks found</p>';
          return;
        }
        
        taskList.innerHTML = filteredTasks.map(task => `
          <div class="task-card ${task.status}">
            <div class="task-info">
              <div class="task-title">${task.title}</div>
              ${task.description ? `<div class="task-desc">${task.description}</div>` : ''}
              <span class="task-status ${task.status}">${task.status}</span>
            </div>
            <div class="task-actions">
              <button class="btn-small btn-complete" onclick="toggleStatus(${task.id}, 'completed')">✓ Complete</button>
              <button class="btn-small btn-delete" onclick="deleteTask(${task.id})">🗑️ Delete</button>
            </div>
          </div>
        `).join('');
      } catch (error) {
        console.error('Error loading tasks:', error);
        taskList.innerHTML = '<p class="no-tasks">Error loading tasks. Make sure server is running.</p>';
      }
    }

    // Filter tasks
    window.filterTasks = function(filter) {
      currentFilter = filter;
      
      // Update active tab
      document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
      event.target.classList.add('active');
      
      loadTasks();
    }

    // Toggle task status
    window.toggleStatus = async function(id, status) {
      try {
        const res = await fetch(`${API}/${id}/status`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status })
        });
        const result = await res.json();
        
        if (status === 'completed') {
          alert('Task completed and removed from list!');
        }
        
        loadTasks();
      } catch (error) {
        alert('Error updating task: ' + error.message);
      }
    }

    // Delete task
    window.deleteTask = async function(id) {
      if (confirm('Delete this task?')) {
        try {
          await fetch(`${API}/${id}`, { method: 'DELETE' });
          loadTasks();
        } catch (error) {
          alert('Error deleting task: ' + error.message);
        }
      }
    }
  </script>
</body>
</html>
