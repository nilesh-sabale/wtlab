<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            max-width: 400px;
            width: 100%;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
        }
        
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .result {
            background: #e3f2fd;
            padding: 20px;
            border-radius: 5px;
            text-align: center;
            margin-top: 20px;
        }
        
        .result h2 {
            color: #667eea;
            font-size: 24px;
        }
        
        .rate {
            color: #999;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function CurrencyConverter() {
            const [dollars, setDollars] = useState('');
            const exchangeRate = 94.91; // 1 USD = 83.50 INR

            const handleChange = (e) => {
                const value = e.target.value;
                if (value === '' || !isNaN(value)) {
                    setDollars(value);
                }
            };

            const rupees = dollars ? (parseFloat(dollars) * exchangeRate).toFixed(2) : '0.00';

            return (
                <div className="container">
                    <h1>💱 Currency Converter</h1>
                    
                    <div className="input-group">
                        <label>Enter Amount in Dollars ($)</label>
                        <input 
                            type="text" 
                            value={dollars}
                            onChange={handleChange}
                            placeholder="Enter amount in USD"
                        />
                    </div>

                    <div className="result">
                        <h2>₹ {rupees}</h2>
                        <p className="rate">Exchange Rate: 1 USD = {exchangeRate} INR</p>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CurrencyConverter />);
    </script>
</body>
</html>
