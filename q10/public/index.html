<!doctype html>
<html>

<head>
  <title>Student Registration</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      padding: 20px;
      color: #333;
    }

    h1 {
      text-align: center;
      color: white;
      margin-bottom: 20px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
    }

    /* FORM CARD */
    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      margin-bottom: 30px;
    }

    .card h2 {
      margin-bottom: 15px;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
      transition: 0.3s;
    }

    input:focus {
      border-color: #667eea;
      box-shadow: 0 0 5px rgba(102, 126, 234, 0.5);
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.05);
    }

    /* TABLE */
    .table-container {
      background: white;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      background: #667eea;
      color: white;
      padding: 15px;
      text-align: left;
      font-weight: 600;
    }

    td {
      padding: 15px;
      text-align: left;
      border-bottom: 1px solid #eee;
      vertical-align: middle;
    }

    tbody tr:hover {
      background: #f8f9ff;
      transition: 0.2s;
    }

    .empty {
      text-align: center;
      padding: 20px;
      color: gray;
    }

    /* ACTION BUTTONS */
    .action-buttons {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      padding: 8px 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      color: white;
      font-size: 14px;
      transition: 0.2s;
    }

    /* Edit Button */
    .edit-btn {
      background: #4caf50;
    }

    .edit-btn:hover {
      background: #45a049;
      transform: scale(1.1);
    }

    /* Delete Button */
    .delete-btn {
      background: #f44336;
    }

    .delete-btn:hover {
      background: #d32f2f;
      transform: scale(1.1);
    }
  </style>
</head>

<body>
  <h1>🎓 Student Registration System</h1>

  <div class="container">
    <!-- FORM -->
    <div class="card">
      <h2>Register Student</h2>
      <form id="studentForm">
        <input type="text" id="name" placeholder="Enter Name" required />
        <input type="email" id="email" placeholder="Enter Email" required />
        <input type="text" id="course" placeholder="Enter Course" required />
        <button type="submit">Register</button>
      </form>
    </div>

   
    <div class="table-container">
      <h2 style="text-align: center; margin-bottom: 20px;">Registered Students</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Course</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="studentTable"></tbody>
      </table>
      <div id="emptyMsg" class="empty"></div>
    </div>
  </div>
  <script>
    let editId = null;

    async function fetchStudents() {
      const res = await fetch("/students");
      const data = await res.json();

      const table = document.getElementById("studentTable");
      table.innerHTML = "";

      data.forEach((student) => {
        table.innerHTML += `
      <tr>
        <td>${student.studentId}</td>
        <td>${student.name}</td>
        <td>${student.email}</td>
        <td>${student.course}</td>
        <td>
          <div class="action-buttons">
            <button class="action-btn edit-btn" 
              onclick="editStudent('${student._id}', '${student.name}', '${student.email}', '${student.course}')">
              ✏️ Edit
            </button>
            <button class="action-btn delete-btn" 
              onclick="deleteStudent('${student._id}')">
              🗑️ Delete
            </button>
          </div>
        </td>
      </tr>
    `;
      });
    }

    // ➕ Add / Update Student
    document
      .getElementById("studentForm")
      .addEventListener("submit", async (e) => {
        e.preventDefault();

        const button = document.querySelector("button");

        button.innerText = editId ? "Updating..." : "Registering...";
        button.disabled = true;

        const student = {
          name: document.getElementById("name").value,
          email: document.getElementById("email").value,
          course: document.getElementById("course").value,
        };

        try {
          if (editId) {
            //Update
            await fetch(`/students/${editId}`, {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(student),
            });
            editId = null;
          } else {
            //Add
            await fetch("/students", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(student),
            });
          }

          setTimeout(() => window.location.reload(), 800);
        } catch (err) {
          alert("Error");
          button.innerText = "Register";
          button.disabled = false;
        }
      });

    // Edit Function
    function editStudent(id, name, email, course) {
      document.getElementById("name").value = name;
      document.getElementById("email").value = email;
      document.getElementById("course").value = course;

      editId = id;

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // Delete Function
    async function deleteStudent(id) {
      if (confirm("Are you sure you want to delete?")) {
        await fetch(`/students/${id}`, {
          method: "DELETE",
        });

        fetchStudents(); // no refresh needed
      }
    }

    // Load data
    fetchStudents();
  </script>
</body>

</html>
